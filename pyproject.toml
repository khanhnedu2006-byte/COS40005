[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cos40005"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[extra,standard]>=0.162.2",
    "fastparquet>=2026.9.0",
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "mapclassify>=2.8.1",
    "networkx>=3.4.2",
    "osmnx[all]>=2.0.7",
    "pandas>=2.3.3",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "pytest>=9.2.0",
    "sbx-rl>=0.28.0",
    "scikit-learn-intelex>=2026.2.0",
    "stable-baselines3>=2.9.2",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.6",
    "pyyaml>=6",
]
web = [
    "fastapi>=0.115",
    "pydantic>=2.11",
    "pyyaml>=6",
    "uvicorn>=0.30",
]
test = [
    "httpx>=0.28",
]

[tool.setuptools.package-dir]
"" = "src"
Web = "Web"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["busroute*", "driverface*", "Web*"]
namespaces = false

[tool.setuptools.package-data]
Web = ["assets/*", "assets/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
